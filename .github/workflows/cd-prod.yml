name: CD Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy_production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Telegram - deploy started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat <<EOF
          🚚 Deploy to production started
          repo: ${{ github.repository }}
          branch: ${{ github.event.workflow_run.head_branch }}
          commit: ${{ github.event.workflow_run.head_sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_APP_PATH }}"
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps
            # Backend may need a few seconds after recreate.
            ATTEMPTS=30
            SLEEP_SEC=2
            for i in $(seq 1 "$ATTEMPTS"); do
              if curl -fsS "http://localhost:8000/health" > /dev/null; then
                echo "Healthcheck passed on attempt ${i}."
                break
              fi
              echo "Healthcheck not ready yet (${i}/${ATTEMPTS}), waiting ${SLEEP_SEC}s..."
              sleep "$SLEEP_SEC"
              if [ "$i" -eq "$ATTEMPTS" ]; then
                echo "Healthcheck failed after ${ATTEMPTS} attempts."
                docker compose logs --tail=100 backend || true
                exit 1
              fi
            done

            # Second smoke-check: make sure business endpoint is alive too.
            curl -fsS "http://localhost:8000/api/v1/orders" > /dev/null
            echo "Smoke-check for /api/v1/orders passed."

      - name: Telegram - deploy success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat <<EOF
          ✅ Production deploy success
          repo: ${{ github.repository }}
          commit: ${{ github.event.workflow_run.head_sha }}
          service status: docker compose ps checked
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Telegram - deploy failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat <<EOF
          ❌ Production deploy failed
          repo: ${{ github.repository }}
          commit: ${{ github.event.workflow_run.head_sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
