services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
      TECH_RO_PASSWORD: ${TECH_RO_PASSWORD}
      TECH_ADMIN_PASSWORD: ${TECH_ADMIN_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Имена файлов с префиксом: init выполняется в лексикографическом порядке;
      # иначе init-users.sh шёл бы раньше init.sql и ломал первый старт.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/init-users.sh:/docker-entrypoint-initdb.d/02-tech-users.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ecommerce:secret@db:5432/ecommerce
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://demo2dev.ru,https://www.demo2dev.ru}
      SQL_ECHO: ${SQL_ECHO:-0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      # На сервере с Caddy добавьте в .env: BEHIND_TLS_PROXY=1 (для HMR по https)
      BEHIND_TLS_PROXY: ${BEHIND_TLS_PROXY:-}
      VITE_APP_HOST: ${VITE_APP_HOST:-demo2dev.ru}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
